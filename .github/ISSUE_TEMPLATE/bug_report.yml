name: Bug report
description: Report something that is not working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
      value: |
        1. Configure gsbt with '...'
        2. Run 'gsbt backup ...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gsbt version
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config (redacted)
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: shell
