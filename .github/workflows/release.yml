name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Build gsbt
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="gsbt_${GITHUB_REF_NAME}_${{ matrix.target }}.tar.gz"
          tar czf "$archive" gsbt
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="gsbt_${GITHUB_REF_NAME}_${{ matrix.target }}.zip"
          7z a "$archive" gsbt.exe
          sha256sum "$archive" > "$archive.sha256"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/gsbt_*.*

  schema:
    name: Publish configuration schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Generate schema
        run: cargo run --quiet --bin gsbt-schema-gen -- gsbt.schema.json
      - name: Upload schema
        uses: softprops/action-gh-release@v2
        with:
          files: gsbt.schema.json

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
