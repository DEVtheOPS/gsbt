name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: rust
          # Use a PAT if provided so that tags/releases it creates trigger other
          # workflows (events created with the default GITHUB_TOKEN do not).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
