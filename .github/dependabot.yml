version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # The ref is a Rust toolchain version, not an action version. Dependabot
      # otherwise "bumps" it to a nonexistent tag (e.g. 1.99.0 -> 1.120.0).
      - dependency-name: "dtolnay/rust-toolchain"
