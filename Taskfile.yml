version: "3"

tasks:
  build:
    desc: Build the gsbt binary
    deps: [schema]
    cmds:
      - cargo build --release

  schema:
    desc: Generate the JSON configuration schema
    cmds:
      - cargo run --quiet --bin gsbt-schema-gen -- gsbt.schema.json

  test:
    desc: Run unit tests
    cmds:
      - cargo test --all-targets

  run:
    desc: Run gsbt with arguments (pass args after --)
    cmds:
      - cargo run --quiet -- {{.CLI_ARGS}}
    vars:
      CLI_ARGS: "{{.CLI_ARGS}}"

  fmt:
    desc: Format the source code
    cmds:
      - cargo fmt --all

  lint:
    desc: Run clippy lints
    cmds:
      - cargo clippy --all-targets -- -D warnings

  tidy:
    desc: Update dependencies
    cmds:
      - cargo update

  release:
    desc: "Create and push a new release tag (usage: task release VER=v1.0.0)"
    cmds:
      - |
        if [ -z "{{.VER}}" ]; then
          echo "Error: VER argument is required (e.g. task release VER=v1.0.0)"
          exit 1
        fi
        # Validate format (basic vX.Y.Z check)
        if [[ ! "{{.VER}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
           echo "Warning: Version '{{.VER}}' does not match standard vX.Y.Z format"
           read -p "Continue anyway? [y/N] " -n 1 -r
           echo
           if [[ ! $REPLY =~ ^[Yy]$ ]]; then exit 1; fi
        fi

        # Check if tag exists locally
        if git rev-parse "{{.VER}}" >/dev/null 2>&1; then
          echo "Error: Tag {{.VER}} already exists locally"
          exit 1
        fi

        # Check if tag exists remotely
        if git ls-remote --tags origin | grep -q "refs/tags/{{.VER}}$"; then
          echo "Error: Tag {{.VER}} already exists on remote"
          exit 1
        fi

        echo "Creating tag {{.VER}}..."
        git tag -a "{{.VER}}" -m "Release {{.VER}}"

        echo "Pushing tag to origin..."
        git push origin "{{.VER}}"
